plugins {
  id 'com.android.application' version '8.2.2'
}

android {
  namespace 'com.daitj.easycontrolfork.app'
  compileSdk 34

  defaultConfig {
    applicationId "com.daitj.easycontrolfork.app"
    minSdk 19
    targetSdk 34
    versionCode 10004
    versionName "1.0.4"
    
    // Wajib diaktifkan untuk KitKat (Android 4.4) agar tidak error saat jumlah metode Java banyak
    multiDexEnabled true

    ndk {
      abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
    }
  }

  viewBinding {
    enabled = true
  }

  buildTypes {
    debug {
      buildConfigField "boolean", "ENABLE_DEBUG_FEATURE", "true"
      manifestPlaceholders = [app_name: "@string/app_name_dev", app_icon: "@mipmap/ic_launcher_dev", app_icon_round: "@mipmap/ic_launcher_dev_round"]
      debuggable true
    }
    release {
      buildConfigField "boolean", "ENABLE_DEBUG_FEATURE", "false"
      manifestPlaceholders = [app_name: "@string/app_name", app_icon: "@mipmap/ic_launcher", app_icon_round: "@mipmap/ic_launcher_round"]
      debuggable false
      
      // DIUBAH KE FALSE: Mencegah ProGuard menghapus/mengobfuskasi kelas penting yang dibutuhkan KitKat
      minifyEnabled false
      shrinkResources false
    }
  }

  compileOptions {
    // DIAKTIFKAN: Mengizinkan fitur Java modern berjalan lancar di Android 4.4 (Desugaring)
    coreLibraryDesugaringEnabled true
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  dependenciesInfo {
    includeInApk = false
    includeInBundle = false
  }

  packagingOptions {
    resources.excludes.add("META-INF/*")
  }
}

dependencies {
  implementation 'androidx.documentfile:documentfile:1.0.1'
  
  // DITAMBAHKAN: Library pendukung MultiDex dan Desugaring untuk Android 4.4
  implementation 'androidx.multidex:multidex:2.0.1'
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
}
