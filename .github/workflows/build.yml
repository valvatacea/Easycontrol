name: Build Easycontrol Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x easycontrolfork/gradlew

      # 1. Build Server & Unsigned Release APK
      - name: Build Server and Release APK
        run: |
          cd easycontrolfork
          ./gradlew assembleDebug -p server
          ./gradlew copyDebug -p server
          ./gradlew assembleRelease

      # 2. Generate Keystore Release
      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias releaseKey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "easycontrolpass" \
            -keypass "easycontrolpass" \
            -dname "CN=Easycontrol, OU=Release, O=AutoBuild, L=City, S=State, C=ID"

      # 3. Zipalign & Sign APK Menggunakan apksigner resmi
      - name: Sign Release APK
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          
          RAW_APK=$(find easycontrolfork/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          ALIGNED_APK="easycontrolfork/app/build/outputs/apk/release/easycontrol-aligned.apk"
          FINAL_APK="easycontrolfork/app/build/outputs/apk/release/Easycontrol-ARMv7a-Release-Signed.apk"
          
          $BUILD_TOOLS_DIR/zipalign -v -p 4 $RAW_APK $ALIGNED_APK
          
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks release.jks \
            --ks-pass pass:"easycontrolpass" \
            --ks-key-alias "releaseKey" \
            --key-pass pass:"easycontrolpass" \
            --out $FINAL_APK \
            $ALIGNED_APK

      # 4. Upload Release APK
      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Easycontrol-ARMv7a-Release-Signed
          path: easycontrolfork/app/build/outputs/apk/release/Easycontrol-ARMv7a-Release-Signed.apk
