name: Build Easycontrol APK (Direct)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x easycontrolfork/gradlew

      # Build server dan APK versi Debug secara langsung
      - name: Build Server and App APK
        run: |
          cd easycontrolfork
          ./gradlew assembleDebug -p server
          ./gradlew copyDebug -p server
          ./gradlew assembleDebug

      # Simpan hasil APK yang siap install
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Easycontrol-ARMv7a-Direct
          path: easycontrolfork/app/build/outputs/apk/debug/app-debug.apk
